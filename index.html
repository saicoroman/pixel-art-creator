<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドット絵クリエイター (ツール充実・V5版)</title>
<style>
    body {
        font-family: sans-serif;
        background-color: #2c3e50;
        color: #ecf0f1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
        user-select: none;
    }

    h1 { margin-top: 0; font-size: 24px; }

    .editor-container {
        display: flex;
        gap: 20px;
        background-color: #34495e;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        max-width: 1000px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
    }

    .tools {
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 250px;
    }

    /* キャンバスを囲う作業ウィンドウ */
    #workspace {
        width: 512px;
        height: 512px;
        background-color: #1a252f;
        border: 2px solid #000;
        border-radius: 5px;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    #pixelCanvas {
        background-color: white;
        background-image: 
            linear-gradient(45deg, #ccc 25%, transparent 25%), 
            linear-gradient(-45deg, #ccc 25%, transparent 25%), 
            linear-gradient(45deg, transparent 75%, #ccc 75%), 
            linear-gradient(-45deg, transparent 75%, #ccc 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        box-shadow: 0 0 15px rgba(0,0,0,0.8);
        image-rendering: pixelated;
        cursor: crosshair;
        margin: auto;
    }

    .tool-group {
        background-color: #2c3e50;
        padding: 10px;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .tool-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* ツール切り替えボタン */
    .tool-btn {
        flex: 1;
        background-color: #7f8c8d;
        color: white;
        border: 2px solid transparent;
        border-radius: 4px;
        padding: 8px 5px;
        font-size: 13px;
    }
    .tool-btn.active {
        background-color: #3498db;
        border: 2px solid #fff;
    }
    .tool-btn:hover:not(.active) {
        background-color: #95a5a6;
    }

    select, input[type="range"], input[type="text"] {
        padding: 8px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
        border-radius: 4px;
        border: none;
    }

    input[type="color"] {
        width: 50px;
        height: 40px;
        padding: 0;
        border: none;
        cursor: pointer;
    }

    button {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover { background-color: #2980b9; }
    button.clear { background-color: #e74c3c; }
    button.clear:hover { background-color: #c0392b; }
    button.save { background-color: #2ecc71; }
    button.save:hover { background-color: #27ae60; }

    /* カラーパレット */
    #palette {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 5px;
    }

    .palette-color {
        width: 25px;
        height: 25px;
        border: 1px solid #fff;
        border-radius: 3px;
        cursor: pointer;
    }
    .palette-color:hover { transform: scale(1.1); }

    /* ギャラリー（小さめのアイコン表示） */
    .gallery-container {
        margin-top: 20px;
        width: 100%;
        max-width: 800px;
        background-color: #34495e;
        padding: 15px;
        border-radius: 10px;
    }

    .gallery-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 15px;
    }

    .gallery-item-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 60px;
        gap: 5px;
    }

    .gallery-item {
        width: 50px;
        height: 50px;
        border: 2px solid #bdc3c7;
        background-color: #fff;
        background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
        background-size: 8px 8px;
        background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
        cursor: pointer;
        image-rendering: pixelated;
        object-fit: contain;
        border-radius: 4px;
    }
    .gallery-item:hover { border-color: #f1c40f; }

    .gallery-name {
        font-size: 11px;
        color: #ecf0f1;
        text-align: center;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .output-area {
        margin-top: 20px;
        width: 100%;
        max-width: 800px;
    }

    textarea {
        width: 100%;
        height: 100px;
        background-color: #1a252f;
        color: #2ecc71;
        font-family: monospace;
        padding: 10px;
        border: 1px solid #000;
        border-radius: 5px;
        box-sizing: border-box;
        resize: vertical;
    }

    label { font-weight: bold; margin-bottom: 5px; display: block; font-size: 14px; }
</style>
</head>
<body>

    <h1>ドット絵クリエイター (ツール充実版)</h1>

    <div class="editor-container">
        <!-- 描画エリア -->
        <div id="workspace">
            <canvas id="pixelCanvas" width="16" height="16"></canvas>
        </div>

        <!-- ツールボックス -->
        <div class="tools">
            <div class="tool-group">
                <label>解像度</label>
                <select id="resolutionSelect">
                    <option value="16x16">16 × 16</option>
                    <option value="32x32">32 × 32</option>
                    <option value="64x64">64 × 64</option>
                    <option value="128x128">128 × 128</option>
                    <option value="256x240">256 × 240</option>
                </select>
            </div>

            <div class="tool-group">
                <label>表示倍率: <span id="zoomLabel">Auto</span></label>
                <input type="range" id="zoomSlider" min="0" max="32" value="0">
            </div>

            <!-- ★ 新機能：ツール切り替え ★ -->
            <div class="tool-group">
                <label>ツール</label>
                <div class="tool-row">
                    <button id="btnPen" class="tool-btn active">ペン</button>
                    <button id="btnEraser" class="tool-btn">消しゴム</button>
                    <button id="btnFill" class="tool-btn">塗りつぶし</button>
                </div>
                <div class="tool-row" style="margin-top: 5px;">
                    <input type="color" id="colorPicker" value="#000000">
                    <div style="flex:1;">
                        <label style="font-size:12px; margin:0;">太さ: <span id="penSizeLabel">1</span>px</label>
                        <input type="range" id="penSize" min="1" max="8" value="1">
                    </div>
                </div>
            </div>

            <!-- ★ 新機能：パレット削除機能追加（右クリック） ★ -->
            <div class="tool-group">
                <label>カラーパレット</label>
                <button id="saveColorBtn">現在の色を保存</button>
                <span style="font-size:11px; color:#bdc3c7;">※右クリック(長押し)で色を削除</span>
                <div id="palette"></div>
            </div>

            <div class="tool-group">
                <label>ギャラリー保存</label>
                <input type="text" id="artworkName" placeholder="作品名 (省略可)">
                <button class="save" id="saveGalleryBtn" style="margin-top: 5px;">ギャラリーに保存</button>
            </div>

            <div class="tool-group">
                <label>操作 / 出力</label>
                <div class="tool-row">
                    <button class="clear" id="clearBtn" style="flex:1;">全消去</button>
                    <button id="generateBtn" style="background-color:#9b59b6; flex:1;">データ出力</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ギャラリーエリア -->
    <div class="gallery-container">
        <h2>保存した作品ギャラリー</h2>
        <button id="clearGalleryBtn" class="clear" style="font-size: 12px;">すべて消去</button>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- 出力データエリア -->
    <div class="output-area">
        <label>1. Data URL (Base64画像データ)</label>
        <textarea id="dataUrlOutput" readonly></textarea>
    </div>

    <div class="output-area">
        <label>2. プログラム用2D配列</label>
        <textarea id="arrayOutput" readonly placeholder="出力ボタンを押すと生成されます..."></textarea>
    </div>

<script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    // UI要素
    const resolutionSelect = document.getElementById('resolutionSelect');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomLabel = document.getElementById('zoomLabel');
    const colorPicker = document.getElementById('colorPicker');
    const penSizeInput = document.getElementById('penSize');
    const penSizeLabel = document.getElementById('penSizeLabel');
    const saveColorBtn = document.getElementById('saveColorBtn');
    const paletteDiv = document.getElementById('palette');
    const clearBtn = document.getElementById('clearBtn');
    
    // ツールボタン群
    const btnPen = document.getElementById('btnPen');
    const btnEraser = document.getElementById('btnEraser');
    const btnFill = document.getElementById('btnFill');

    // 保存・出力系要素
    const artworkNameInput = document.getElementById('artworkName');
    const saveGalleryBtn = document.getElementById('saveGalleryBtn');
    const galleryGrid = document.getElementById('galleryGrid');
    const clearGalleryBtn = document.getElementById('clearGalleryBtn');
    const generateBtn = document.getElementById('generateBtn');
    const dataUrlOutput = document.getElementById('dataUrlOutput');
    const arrayOutput = document.getElementById('arrayOutput');

    // 状態管理
    let currentWidth = 16;
    let currentHeight = 16;
    let isDrawing = false;
    let currentColor = '#000000';
    let currentPenSize = 1;
    let currentZoom = 0;
    
    // 現在のツール ('pen', 'eraser', 'fill')
    let activeTool = 'pen'; 

    // --- ツール切り替え処理 ---
    function setTool(toolName) {
        activeTool = toolName;
        btnPen.classList.remove('active');
        btnEraser.classList.remove('active');
        btnFill.classList.remove('active');
        
        if (toolName === 'pen') btnPen.classList.add('active');
        else if (toolName === 'eraser') btnEraser.classList.add('active');
        else if (toolName === 'fill') btnFill.classList.add('active');
    }

    btnPen.addEventListener('click', () => setTool('pen'));
    btnEraser.addEventListener('click', () => setTool('eraser'));
    btnFill.addEventListener('click', () => setTool('fill'));

    colorPicker.addEventListener('input', (e) => {
        currentColor = e.target.value;
        if (activeTool === 'eraser') setTool('pen'); // 色を変えたら自動でペンに戻す
    });

    penSizeInput.addEventListener('input', (e) => {
        currentPenSize = parseInt(e.target.value, 10);
        penSizeLabel.textContent = currentPenSize;
    });

    // --- ズーム（表示倍率）の更新処理 ---
    function updateCanvasDisplay() {
        let scale = 1;
        if (currentZoom === 0) {
            const scaleX = 512 / currentWidth;
            const scaleY = 512 / currentHeight;
            scale = Math.floor(Math.min(scaleX, scaleY));
            if(scale < 1) scale = 1;
            zoomLabel.textContent = `Auto (${scale}倍)`;
        } else {
            scale = currentZoom;
            zoomLabel.textContent = `${scale}倍`;
        }
        canvas.style.width = (currentWidth * scale) + 'px';
        canvas.style.height = (currentHeight * scale) + 'px';
    }

    zoomSlider.addEventListener('input', (e) => {
        currentZoom = parseInt(e.target.value, 10);
        updateCanvasDisplay();
    });

    // --- 解像度変更処理 ---
    resolutionSelect.addEventListener('change', (e) => {
        if(confirm("解像度を変更するとキャンバスがリセットされます。よろしいですか？")) {
            const [w, h] = e.target.value.split('x').map(Number);
            currentWidth = w;
            currentHeight = h;
            canvas.width = w;
            canvas.height = h;
            ctx.clearRect(0, 0, w, h);
            
            if(w <= 16) penSizeInput.max = 8;
            else if(w <= 32) penSizeInput.max = 10;
            else if(w <= 64) penSizeInput.max = 16;
            else if(w <= 128) penSizeInput.max = 24;
            else penSizeInput.max = 40;
            
            if(currentPenSize > parseInt(penSizeInput.max)) {
                currentPenSize = parseInt(penSizeInput.max);
                penSizeInput.value = currentPenSize;
                penSizeLabel.textContent = currentPenSize;
            }

            zoomSlider.value = 0;
            currentZoom = 0;
            updateCanvasDisplay();
        } else {
            e.target.value = `${currentWidth}x${currentHeight}`;
        }
    });

    updateCanvasDisplay();

    // --- カラー変換用の補助関数 ---
    function hexToRgba(hex) {
        let r = 0, g = 0, b = 0;
        if (hex.length == 4) {
            r = parseInt(hex[1] + hex[1], 16);
            g = parseInt(hex[2] + hex[2], 16);
            b = parseInt(hex[3] + hex[3], 16);
        } else if (hex.length == 7) {
            r = parseInt(hex[1] + hex[2], 16);
            g = parseInt(hex[3] + hex[4], 16);
            b = parseInt(hex[5] + hex[6], 16);
        }
        return [r, g, b, 255];
    }

    function colorMatch(a, b) {
        return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
    }

    // --- 塗りつぶし（Flood Fill）アルゴリズム ---
    function floodFill(startX, startY, fillColorHex) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const startPos = (startY * canvas.width + startX) * 4;
        
        const targetColor = [data[startPos], data[startPos+1], data[startPos+2], data[startPos+3]];
        const fillColor = hexToRgba(fillColorHex);

        if (colorMatch(targetColor, fillColor)) return; // 同じ色なら何もしない

        const pixelsToCheck = [startX, startY];
        const width = canvas.width;
        const height = canvas.height;

        while (pixelsToCheck.length > 0) {
            const y = pixelsToCheck.pop();
            const x = pixelsToCheck.pop();
            const pos = (y * width + x) * 4;

            if (data[pos] === targetColor[0] && data[pos+1] === targetColor[1] && data[pos+2] === targetColor[2] && data[pos+3] === targetColor[3]) {
                data[pos] = fillColor[0];
                data[pos+1] = fillColor[1];
                data[pos+2] = fillColor[2];
                data[pos+3] = fillColor[3]; // alpha

                if (x > 0) { pixelsToCheck.push(x - 1, y); }
                if (x < width - 1) { pixelsToCheck.push(x + 1, y); }
                if (y > 0) { pixelsToCheck.push(x, y - 1); }
                if (y < height - 1) { pixelsToCheck.push(x, y + 1); }
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // --- 描画ロジック ---
    function handleDrawEvent(e, isClickDown) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);

        if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;

        if (activeTool === 'fill') {
            if (isClickDown) { // 塗りつぶしはクリックした瞬間だけ発動
                floodFill(x, y, currentColor);
            }
            return;
        }

        // ペン・消しゴムの処理
        const startX = x - Math.floor(currentPenSize / 2);
        const startY = y - Math.floor(currentPenSize / 2);

        if (activeTool === 'eraser') {
            ctx.clearRect(startX, startY, currentPenSize, currentPenSize);
        } else {
            ctx.fillStyle = currentColor;
            ctx.fillRect(startX, startY, currentPenSize, currentPenSize);
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        handleDrawEvent(e, true);
    });
    canvas.addEventListener('mousemove', (e) => {
        if(isDrawing) handleDrawEvent(e, false);
    });
    window.addEventListener('mouseup', () => { isDrawing = false; });
    canvas.addEventListener('mouseleave', () => { isDrawing = false; });

    clearBtn.addEventListener('click', () => {
        if(confirm("キャンバスを全て消去しますか？")) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    });

    // --- カラーパレット機能（削除機能つき） ---
    let savedColors = new Set();
    
    function addColorToDOM(color) {
        const div = document.createElement('div');
        div.className = 'palette-color';
        div.style.backgroundColor = color;
        
        // 左クリックで色を選択
        div.addEventListener('click', () => {
            colorPicker.value = color;
            currentColor = color;
            if(activeTool === 'eraser') setTool('pen');
        });

        // 右クリック（コンテキストメニュー）で色を削除
        div.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // デフォルトの右クリックメニューを禁止
            if(confirm("この色をパレットから削除しますか？")) {
                savedColors.delete(color);
                div.remove();
                savePaletteToStorage(); // ストレージ更新
            }
        });

        paletteDiv.appendChild(div);
    }

    function savePaletteToStorage() {
        localStorage.setItem('pixelArtPalette', JSON.stringify(Array.from(savedColors)));
    }

    saveColorBtn.addEventListener('click', () => {
        const color = colorPicker.value;
        if (!savedColors.has(color)) {
            savedColors.add(color);
            addColorToDOM(color);
            savePaletteToStorage();
        }
    });

    // パレットの初期化（ローカルストレージにない場合はデフォルト色）
    const storedPalette = JSON.parse(localStorage.getItem('pixelArtPalette'));
    if (storedPalette && storedPalette.length > 0) {
        storedPalette.forEach(c => {
            savedColors.add(c);
            addColorToDOM(c);
        });
    } else {
        ['#000000', '#ffffff', '#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22'].forEach(c => {
            savedColors.add(c);
            addColorToDOM(c);
        });
        savePaletteToStorage();
    }

    // --- ギャラリー（保存・名前・アイコン）機能 ---
    function loadGallery() {
        galleryGrid.innerHTML = '';
        const savedData = JSON.parse(localStorage.getItem('pixelArtGallery_v5') || '[]');
        
        // v4からのデータ引き継ぎ処理
        const oldData = JSON.parse(localStorage.getItem('pixelArtGallery_v4') || 'null');
        if (oldData && savedData.length === 0) {
            oldData.forEach(url => savedData.push({ name: "無題", data: url }));
            localStorage.setItem('pixelArtGallery_v5', JSON.stringify(savedData));
            localStorage.removeItem('pixelArtGallery_v4');
        }

        savedData.forEach((item) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-item-wrapper';

            const img = document.createElement('img');
            img.src = item.data;
            img.className = 'gallery-item';
            img.title = item.name; // ホバーで名前を表示
            
            const nameLabel = document.createElement('div');
            nameLabel.className = 'gallery-name';
            nameLabel.textContent = item.name;

            img.addEventListener('click', () => {
                if(confirm(`「${item.name}」をキャンバスに読み込みますか？`)) {
                    const loadImg = new Image();
                    loadImg.onload = () => {
                        currentWidth = loadImg.width;
                        currentHeight = loadImg.height;
                        canvas.width = currentWidth;
                        canvas.height = currentHeight;
                        
                        let optionExists = false;
                        for(let i=0; i<resolutionSelect.options.length; i++){
                            if(resolutionSelect.options[i].value === `${currentWidth}x${currentHeight}`){
                                resolutionSelect.value = `${currentWidth}x${currentHeight}`;
                                optionExists = true;
                                break;
                            }
                        }
                        if(!optionExists) {
                            const newOption = document.createElement('option');
                            newOption.value = `${currentWidth}x${currentHeight}`;
                            newOption.text = `${currentWidth} × ${currentHeight}`;
                            resolutionSelect.appendChild(newOption);
                            resolutionSelect.value = `${currentWidth}x${currentHeight}`;
                        }
                        
                        zoomSlider.value = 0;
                        currentZoom = 0;
                        updateCanvasDisplay();
                        
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(loadImg, 0, 0);
                        
                        // 読み込み時に作品名を入力欄にセット
                        artworkNameInput.value = item.name === "無題" ? "" : item.name;
                    };
                    loadImg.src = item.data;
                }
            });

            wrapper.appendChild(img);
            wrapper.appendChild(nameLabel);
            galleryGrid.appendChild(wrapper);
        });
    }

    saveGalleryBtn.addEventListener('click', () => {
        const dataURL = canvas.toDataURL("image/png");
        const name = artworkNameInput.value.trim() || "無題"; // 名前が空なら「無題」
        
        let savedData = JSON.parse(localStorage.getItem('pixelArtGallery_v5') || '[]');
        savedData.push({ name: name, data: dataURL });
        localStorage.setItem('pixelArtGallery_v5', JSON.stringify(savedData));
        
        loadGallery();
        artworkNameInput.value = ''; // 保存後に入力欄をクリア
        alert(`「${name}」をギャラリーに保存しました！`);
    });

    clearGalleryBtn.addEventListener('click', () => {
        if(confirm("ギャラリーの作品を全て削除しますか？")) {
            localStorage.removeItem('pixelArtGallery_v5');
            loadGallery();
        }
    });

    loadGallery();

    // --- データ出力機能 ---
    function rgbToHex(r, g, b) {
        return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
    }

    generateBtn.addEventListener('click', () => {
        const dataURL = canvas.toDataURL("image/png");
        dataUrlOutput.value = `url('${dataURL}')`;
        arrayOutput.value = "生成中...";
        
        setTimeout(() => {
            const imgData = ctx.getImageData(0, 0, currentWidth, currentHeight).data;
            let arrayString = "[\n";
            for (let y = 0; y < currentHeight; y++) {
                let rowArray = [];
                for (let x = 0; x < currentWidth; x++) {
                    const i = (y * currentWidth + x) * 4;
                    const r = imgData[i];
                    const g = imgData[i + 1];
                    const b = imgData[i + 2];
                    const a = imgData[i + 3];

                    if (a === 0) rowArray.push("null");
                    else rowArray.push(`"${rgbToHex(r, g, b)}"`);
                }
                arrayString += "  [" + rowArray.join(", ") + "],\n";
            }
            arrayString += "]";
            arrayOutput.value = arrayString;
        }, 50);
    });

</script>
</body>
</html>
